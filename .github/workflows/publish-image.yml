name: Publish image

# Release tags only. Pushing v1.2.3 publishes ghcr.io/bjalt/byd-reader:v1.2.3 and moves :latest.
# Creating a GitHub Release with a new tag fires this too, since that also pushes the tag ref.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Native arm64 — the daemon runs on an arm64 host, so there is no emulation and no
    # multi-arch manifest. Adding linux/amd64 means a second runner plus a merge job.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Refuse to publish from a non-tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::This workflow publishes release tags only. Re-run it against a v* tag."
          exit 1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Fail if no tags were derived
        if: ${{ steps.meta.outputs.tags == '' }}
        run: |
          echo "::error::metadata-action produced no image tags for ${{ github.ref }}."
          exit 1

      # Built and smoke-tested before anything is pushed, so a broken image never
      # reaches :latest. The push step below re-uses these exact layers.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: APP_ENV=prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          # ENTRYPOINT is "php bin/console app:read", so --help boots the prod container,
          # resolves the DI wiring for these env vars, and exits.
          docker run --rm \
            -e MQTT_HOST=localhost -e MQTT_PORT=1883 \
            -e MQTT_USERNAME=ci -e MQTT_PASSWORD=ci \
            -e CSV_EXPORT=0 -e INTERVAL=30 \
            "$IMAGE" --help

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker push "$tag"
          done
